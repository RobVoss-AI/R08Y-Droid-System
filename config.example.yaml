# R08Y configuration for the Freenove Pi 4B + XVF3800 build.
# Copy to config.yaml. Keep API keys in /etc/r08y/r08y.env or your shell.

freenove:
  # Directory containing the official motor.py, servo.py, ultrasonic.py, and adc.py.
  # Leave null to search the official clone under the service user's home directory.
  library_path: null
  auto_discover: true

camera:
  enabled: true
  backend: auto            # auto tries Picamera2, then OpenCV/V4L2
  device_index: 0
  device_path: null         # Set /dev/videoN only after confirming it on the Pi
  width: 640
  height: 480
  fps: 30
  horizontal_flip: false
  vertical_flip: false

face_detection:
  method: haar
  scale_factor: 1.3
  min_neighbors: 5
  detection_width: 320
  confidence_threshold: 0.5

face_recognition:
  db_path: data/faces.db
  tolerance: 0.6
  max_encodings_per_person: 5
  cache_ttl_seconds: 5

servos:
  enabled: true
  driver: freenove         # Uses the official Freenove Servo adapter
  freenove_library_path: null
  i2c_address: 0x40
  pan_channel: 0
  tilt_channel: 1
  gpio_pan_pin: null       # Only used by explicit driver: gpio
  gpio_tilt_pin: null
  pan_min: 30
  pan_max: 150
  tilt_min: 30
  tilt_max: 150
  home_pan: 90
  home_tilt: 90
  speed: 120

tracker:
  pid_kp: 0.05
  pid_ki: 0.01
  pid_kd: 0.02
  dead_zone: 0.05
  patrol_speed: 30
  no_face_timeout: 5.0

# One motion owner blends tracking, gestures, and conversational body language.
# Every target remains inside the servo limits above. Wheels are never used here.
expression:
  enabled: true
  update_interval: 0.05
  max_step_degrees: 3.0
  gesture_scale: 1.0
  ambient_enabled: true
  idle_sway_degrees: 1.5
  thinking_sway_degrees: 3.0
  speaking_bob_degrees: 1.5
  queue_size: 8

audio:
  sample_rate: 16000       # Processing format used by wake word and STT
  channels: 1
  chunk_size: 512
  device_index: null       # Avoid volatile numeric indexes when possible
  device_name: XVF3800
  require_device_match: true
  capture_backend: auto    # XVF3800 uses bounded arecord; other mics retain PyAudio
  hardware_sample_rate: 16000  # XVF3800 native capture format: S16_LE/16 kHz/stereo
  hardware_channels: 2        # Downmixed to processing channels before wake word/STT
  rms_threshold: 500
  silence_duration: 1.5
  max_record_seconds: 30

wake_word:
  engine: porcupine
  phrase: ROBY
  porcupine_access_key: ""
  keyword_path: /opt/r08y/wake_words/roby.ppn
  sensitivity: 0.5
  allow_rms_fallback: false  # Never substitute a generic sound trigger in normal use

stt:
  provider: groq
  openai_api_key: ""
  groq_api_key: ""
  model: whisper-large-v3
  language: en

ai:
  api_key: ""
  model: claude-sonnet-5-5
  max_history_turns: 20
  system_prompt: |
    You are R08Y, a friendly and capable physical droid. You can see through
    a camera, recognize people, measure distance, report light levels, and
    move on mecanum wheels when a registered skill handles the request. Keep
    spoken responses concise. Never claim a physical action succeeded unless
    the hardware layer confirmed it.
  spoken_style: |
    Speak with calm warmth and a lightly playful droid personality. Use natural
    contractions and plain spoken language. Keep most replies to one or two
    short sentences and under 30 words when practical. Help first, then add at
    most one understated witty aside when it fits. Avoid filler, monologues,
    sarcasm, and theatrical robot catchphrases.
  conversations_db_path: data/conversations.db

tts:
  voice: en-US-AndrewMultilingualNeural
  rate: "+1%"
  pitch: "+2Hz"
  volume: "+0%"
  playback_command: pw-play   # Targets the XVF3800 PipeWire sink by discovered ID
  output_device_name: XVF3800
  output_target: null
  set_pipewire_default: true
  require_output_device_match: true

distance:
  enabled: true
  driver: freenove
  freenove_library_path: null
  trigger_pin: null         # Never needed by the Freenove adapter
  echo_pin: null
  max_distance_m: 3.0
  timeout_seconds: 0.2

light_sensors:
  enabled: true
  driver: freenove
  freenove_library_path: null
  left_channel: 0
  right_channel: 1

mobility:
  enabled: true
  driver: freenove
  freenove_library_path: null
  max_duty: 2200
  default_speed: 0.45
  default_duration: 0.6
  max_duration: 2.0
  command_timeout: 2.5
  obstacle_stop_cm: 30.0
  require_distance_for_forward: true
  wheel_scale: [1.0, 1.0, 1.0, 1.0]

power:
  ups_enabled: false        # Keep false until the UPS HAT is physically integrated
  ups_model: null

logging:
  level: INFO
  file: null

skills:
  disabled: []

  weather:
    latitude: 40.3461
    longitude: -94.8725
    location_name: Maryville, Missouri

  daily_briefing:
    latitude: 40.3461
    longitude: -94.8725
    location_name: Maryville, Missouri

  home_assistant:
    url: http://homeassistant.local:8123
    token: ""
    entities: {}

  distance_sensor:
    approach_threshold: 50

  mobility_control:
    speed: 0.45
    duration: 0.6
    max_duration: 2.0

  led_controller:
    num_pixels: 12
    brightness: 0.3
